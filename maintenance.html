<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BLACKOUT CREW</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  /* 외부 파일을 하나도 안 쓴다 — vercel.json 이 모든 경로를 이 파일로 돌리기 때문에
     이미지·CSS·폰트를 불러오면 전부 이 페이지가 돌아온다. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    color: rgba(255, 255, 255, 0.72);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Pretendard,
                 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 24px;
    text-align: center;
  }
  h1 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: #fff;
  }
  hr { width: 46px; border: 0; border-top: 1px solid rgba(255, 255, 255, 0.22); }
  p { font-size: 13px; line-height: 1.9; color: rgba(255, 255, 255, 0.42); }
</style>
</head>
<body>
  <main>
    <h1>BLACKOUT CREW</h1>
    <hr />
    <p>현재 페이지를 열어두지 않았습니다.</p>
  </main>
</body>
</html>
